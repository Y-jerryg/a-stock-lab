name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: a_stock_lab_test
          POSTGRES_USER: a_stock_lab
          POSTGRES_PASSWORD: a_stock_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U a_stock_lab -d a_stock_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://a_stock_lab:a_stock_lab@localhost:5432/a_stock_lab_test
      TEST_DATABASE_URL: postgresql+psycopg://a_stock_lab:a_stock_lab@localhost:5432/a_stock_lab_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src tests
      - name: Database migrations
        run: uv run alembic upgrade head && uv run alembic check
      - name: Pytest
        run: uv run pytest
      - name: Build backend image
        run: docker build --target runtime -t a-stock-lab-backend:ci .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Prettier
        run: pnpm exec prettier --check .
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Build frontend image
        run: docker build --target runtime -t a-stock-lab-frontend:ci .
