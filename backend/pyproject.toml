[project]
name = "a-stock-lab"
version = "0.1.0"
description = "Production foundation for the A-Stock Lab research platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "akshare>=1.18.94,<1.19",
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "pyarrow>=20,<24",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
market-data-diagnostic = "a_stock_lab.shared.market_data.diagnostic:main"
market-snapshot = "a_stock_lab.shared.market_data.execution_cli:main"
tail-radar = "a_stock_lab.features.tail_radar.execution_cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.0,<3",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a_stock_lab"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["a_stock_lab"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "postgres: integration tests requiring a migrated PostgreSQL test database",
]
