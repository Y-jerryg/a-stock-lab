server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        # A removed lazy chunk must not return/cache the HTML shell as JavaScript.
        try_files $uri =404;
    }

    location /data/trend-radar/ {
        limit_except GET { deny all; }
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        # Research can use the backend's full 300-second provider timeout.
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        # Never replay a paid POST after an ambiguous upstream disconnect.
        proxy_next_upstream off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
